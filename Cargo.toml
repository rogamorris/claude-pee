[package]
name = "claude-pee"
version = "0.1.0"
edition = "2024"
description = "claude-pee binary"
license = "MIT OR Apache-2.0"
repository = ""
publish = false

[dependencies]
env_logger = "0.11.10"
log = "0.4.29"
nix = { version = "0.28.0", features = ["process", "signal"] }
portable-pty = "0.9.0"
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.24.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }

# Tolerated: transitive deps in the ecosystem still publish under multiple
# major versions of common crates (e.g. bitflags 1.x and 2.x).
multiple_crate_versions = "allow"
# Tolerated: we deliberately hold stdin/stdout locks for the lifetime of
# bridge threads to keep PTY I/O serialized.
significant_drop_tightening = "allow"

# Explicit denies from the restriction group — these are the panic/unwrap/expect bans.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
integer_division = "deny"
float_arithmetic = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
mem_forget = "deny"
string_slice = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
